[project]
name = "delta"
version = "0.1.0"
description = "SEC Form D filings, ingested and modeled in DuckDB."
readme = "README.md"
authors = [
    { name = "Javier Rios", email = "javi@cmu.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13",
    "dagster-sqlmesh>=0.22",
    "dagster-webserver>=1.13",
    "duckdb>=1.5",
    "httpx>=0.28.1",
    "polars>=1.44.2",
    "python-dotenv>=1.2.4",
    "sqlmesh[web]>=0.236",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.dagster]
module_name = "delta.definitions"
code_location_name = "delta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
